<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Jenis data dalam rekayasa sipil</title><desc id="desc">Lima bentuk data: tabular numerik, kategorikal, citra dan video, deret waktu, serta teks, masing-masing dengan contoh rekayasa.</desc>
<defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.h{font-size:24px;font-weight:700}.b{font-size:19px;fill:#40566b}.small{font-size:17px;fill:#536779}</style><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324d" flood-opacity=".10"/></filter></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">Bentuk data yang dijumpai dalam rekayasa</text><text x="90" y="132" class="sub">Satu proyek dapat menggabungkan beberapa bentuk data dengan kebutuhan penanganan berbeda.</text>
<g filter="url(#s)"><rect x="90" y="190" width="450" height="250" rx="24" fill="#fff"/><rect x="575" y="190" width="450" height="250" rx="24" fill="#fff"/><rect x="1060" y="190" width="450" height="250" rx="24" fill="#fff"/><rect x="330" y="485" width="450" height="250" rx="24" fill="#fff"/><rect x="820" y="485" width="450" height="250" rx="24" fill="#fff"/></g>
<text x="130" y="245" class="h">Numerik tabular</text><text x="130" y="290" class="b"><tspan x="130">Nilai pengukuran dan besaran</tspan><tspan x="130" dy="28">kuantitatif dalam baris dan kolom.</tspan></text><text x="130" y="380" class="small">Contoh: kuat tekan, debit, lendutan,</text><text x="130" y="405" class="small">temperatur, dan kadar air.</text>
<text x="615" y="245" class="h">Kategorikal tabular</text><text x="615" y="290" class="b"><tspan x="615">Label atau kelompok yang</tspan><tspan x="615" dy="28">menyatakan kelas atau jenis.</tspan></text><text x="615" y="380" class="small">Contoh: material, kelas kerusakan,</text><text x="615" y="405" class="small">jenis tanah, dan status inspeksi.</text>
<text x="1100" y="245" class="h">Citra dan video</text><text x="1100" y="290" class="b"><tspan x="1100">Piksel atau rangkaian bingkai</tspan><tspan x="1100" dy="28">yang memuat informasi visual.</tspan></text><text x="1100" y="380" class="small">Contoh: retak permukaan, foto aset,</text><text x="1100" y="405" class="small">dan rekaman lalu lintas.</text>
<text x="370" y="540" class="h">Deret waktu</text><text x="370" y="585" class="b"><tspan x="370">Pengukuran berurutan dengan cap</tspan><tspan x="370" dy="28">waktu atau urutan pengamatan.</tspan></text><text x="370" y="675" class="small">Contoh: percepatan struktur, hujan,</text><text x="370" y="700" class="small">debit sungai, dan arus lalu lintas.</text>
<text x="860" y="540" class="h">Teks</text><text x="860" y="585" class="b"><tspan x="860">Catatan atau dokumen yang</tspan><tspan x="860" dy="28">memerlukan pengolahan bahasa.</tspan></text><text x="860" y="675" class="small">Contoh: laporan inspeksi, catatan</text><text x="860" y="700" class="small">harian, dan dokumen proyek.</text>
<rect x="250" y="785" width="1100" height="52" rx="24" fill="#e5edf3"/><text x="800" y="818" text-anchor="middle" class="small">Struktur, unit pengamatan, satuan, dan urutan waktu harus dicatat sebelum analisis.</text>
</svg>
