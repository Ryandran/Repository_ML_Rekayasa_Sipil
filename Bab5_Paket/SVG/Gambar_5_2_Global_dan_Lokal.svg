<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Evaluasi global dan lokal</title><desc id="d">Metrik global disandingkan dengan pemeriksaan residual, subset, kasus dan konsistensi fungsional.</desc><rect width="1200" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#243746"><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">Metrik global perlu dibaca bersama pemeriksaan lokal</text><rect x="70" y="125" width="460" height="400" rx="18" fill="#eaf2f8" stroke="#52758e" stroke-width="2"/><rect x="670" y="125" width="460" height="400" rx="18" fill="#fdf0df" stroke="#bd8245" stroke-width="2"/><text x="300" y="175" text-anchor="middle" font-size="24" font-weight="700">Ringkasan global</text><text x="900" y="175" text-anchor="middle" font-size="24" font-weight="700">Pemeriksaan lokal</text><text x="110" y="245" font-size="19">MAE / RMSE / R²</text><text x="110" y="290" font-size="19">Accuracy / recall / F1</text><text x="110" y="335" font-size="19">Silhouette / inertia</text><text x="110" y="415" font-size="17">Merangkum satu aspek kinerja</text><text x="110" y="445" font-size="17">pada himpunan evaluasi.</text><text x="710" y="245" font-size="19">Residual berurutan</text><text x="710" y="290" font-size="19">Kasus dan aset individual</text><text x="710" y="335" font-size="19">Subset dan kondisi ekstrem</text><text x="710" y="380" font-size="19">Pemeriksaan rasional</text><text x="710" y="455" font-size="17">Menunjukkan di mana dan bagaimana</text><text x="710" y="485" font-size="17">model gagal atau melanggar kebutuhan.</text><path d="M545 325h105m-25-20 25 20-25 20" fill="none" stroke="#667b89" stroke-width="5"/><text x="600" y="590" text-anchor="middle" font-size="18" fill="#526171">Gunakan keduanya untuk menjelaskan kinerja dan batas penerapan.</text></g></svg>
