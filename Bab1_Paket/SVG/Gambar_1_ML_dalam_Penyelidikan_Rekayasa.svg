<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Machine learning dalam penyelidikan rekayasa</title><desc id="desc">Masalah rekayasa berada di pusat dan dapat diselidiki melalui prinsip fisik, eksperimen, simulasi numerik, statistik, dan machine learning. Metode dapat dipilih atau digabungkan sesuai tujuan dan bukti.</desc>
<defs><style>
text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.cardhead{font-size:26px;font-weight:700}.body{font-size:20px;fill:#40566b}.centerhead{font-size:27px;font-weight:700;fill:#fff}.centerbody{font-size:19px;fill:#eaf3fa}.small{font-size:19px;fill:#536779}
</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17324d" flood-opacity=".10"/></filter></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">ML dalam penyelidikan rekayasa</text><text x="90" y="132" class="sub">Pilih metode berdasarkan pertanyaan, data, asumsi, dan bukti yang diperlukan.</text>
<!-- connectors -->
<g stroke="#a8bac9" stroke-width="4" fill="none"><path d="M800 435 L800 280"/><path d="M650 475 L440 365"/><path d="M950 475 L1160 365"/><path d="M680 545 L470 665"/><path d="M920 545 L1130 665"/></g>
<g filter="url(#shadow)">
<rect x="600" y="395" width="400" height="190" rx="28" fill="#163b5c"/>
<rect x="90" y="190" width="480" height="190" rx="24" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>
<rect x="1030" y="190" width="480" height="190" rx="24" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>
<rect x="100" y="600" width="480" height="190" rx="24" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>
<rect x="1020" y="600" width="480" height="190" rx="24" fill="#eaf5f2" stroke="#9dcfc2" stroke-width="2"/>
<rect x="560" y="170" width="480" height="150" rx="24" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>
</g>
<text x="800" y="455" text-anchor="middle" class="centerhead">MASALAH</text><text x="800" y="492" text-anchor="middle" class="centerhead">REKAYASA</text><text x="800" y="533" text-anchor="middle" class="centerbody">Apa yang perlu diketahui atau diputuskan?</text>
<text x="125" y="240" class="cardhead">Prinsip fisik</text><text x="125" y="282" class="body"><tspan x="125">Menurunkan perilaku dari mekanisme,</tspan><tspan x="125" dy="30">hukum, dan asumsi yang dirumuskan.</tspan></text>
<text x="1065" y="240" class="cardhead">Eksperimen</text><text x="1065" y="282" class="body"><tspan x="1065">Mengamati respons spesimen atau</tspan><tspan x="1065" dy="30">sistem dalam kondisi uji.</tspan></text>
<text x="135" y="650" class="cardhead">Statistik</text><text x="135" y="692" class="body"><tspan x="135">Mengukur pola, variasi, dan ketidakpastian</tspan><tspan x="135" dy="30">berdasarkan data dan rancangan analisis.</tspan></text>
<text x="1055" y="650" class="cardhead">Machine learning</text><text x="1055" y="692" class="body"><tspan x="1055">Mempelajari pola dari contoh data untuk</tspan><tspan x="1055" dy="30">mendukung prediksi atau eksplorasi.</tspan></text>
<text x="595" y="220" class="cardhead">Simulasi numerik</text><text x="595" y="260" class="body"><tspan x="595">Memperkirakan respons melalui model komputasi</tspan><tspan x="595" dy="30">dengan formulasi dan kondisi batas tertentu.</tspan></text>
<rect x="390" y="824" width="820" height="48" rx="24" fill="#e5edf3"/><text x="800" y="855" text-anchor="middle" class="small">Metode dapat saling melengkapi; hasil tetap perlu diperiksa dan divalidasi.</text>
</svg>
