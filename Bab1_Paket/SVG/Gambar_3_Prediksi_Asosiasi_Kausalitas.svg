<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Prediksi, asosiasi, dan kausalitas</title><desc id="desc">Tiga panel membedakan pertanyaan prediksi, asosiasi, dan kausalitas dengan contoh kadar air dan kerusakan jalan. Performa prediksi atau asosiasi tidak cukup untuk menyimpulkan sebab-akibat.</desc>
<defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.head{font-size:29px;font-weight:700}.ask{font-size:22px;font-weight:700;fill:#26718a}.body{font-size:20px;fill:#40566b}.tiny{font-size:18px;fill:#536779}.warn{font-size:21px;font-weight:700;fill:#8a4c28}</style><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324d" flood-opacity=".10"/></filter><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#327b9a"/></marker></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">Prediksi, asosiasi, dan kausalitas</text><text x="90" y="132" class="sub">Ketiganya menjawab pertanyaan berbeda; satu jenis bukti tidak otomatis menjawab semuanya.</text>
<g filter="url(#s)"><rect x="90" y="190" width="450" height="500" rx="26" fill="#fff"/><rect x="575" y="190" width="450" height="500" rx="26" fill="#fff"/><rect x="1060" y="190" width="450" height="500" rx="26" fill="#fff"/></g>
<rect x="90" y="190" width="450" height="12" rx="6" fill="#327b9a"/><rect x="575" y="190" width="450" height="12" rx="6" fill="#6d8a9b"/><rect x="1060" y="190" width="450" height="12" rx="6" fill="#c27a48"/>
<text x="135" y="255" class="head">Prediksi</text><text x="135" y="305" class="ask">Apa yang mungkin terjadi?</text><text x="135" y="365" class="body"><tspan x="135">Perkirakan risiko kerusakan jalan</tspan><tspan x="135" dy="30">untuk segmen yang belum diperiksa,</tspan><tspan x="135" dy="30">berdasarkan data yang tersedia.</tspan></text>
<rect x="145" y="485" width="140" height="58" rx="14" fill="#e8f2f7"/><text x="215" y="521" text-anchor="middle" class="tiny">Data masukan</text><path d="M295 514 H340" stroke="#327b9a" stroke-width="3" marker-end="url(#arr)"/><rect x="350" y="485" width="145" height="58" rx="14" fill="#e8f2f7"/><text x="422" y="521" text-anchor="middle" class="tiny">Perkiraan</text>
<text x="135" y="610" class="tiny">Dinilai dengan data uji yang sesuai</text>
<text x="620" y="255" class="head">Asosiasi</text><text x="620" y="305" class="ask">Pola apa yang berkaitan?</text><text x="620" y="365" class="body"><tspan x="620">Apakah kadar air tercatat lebih tinggi</tspan><tspan x="620" dy="30">pada segmen dengan tingkat kerusakan</tspan><tspan x="620" dy="30">yang lebih besar?</tspan></text>
<circle cx="710" cy="520" r="57" fill="#edf2f5" stroke="#8ea6b5" stroke-width="3"/><circle cx="885" cy="520" r="57" fill="#edf2f5" stroke="#8ea6b5" stroke-width="3"/><text x="710" y="514" text-anchor="middle" class="tiny">Kadar</text><text x="710" y="539" text-anchor="middle" class="tiny">air</text><text x="885" y="514" text-anchor="middle" class="tiny">Kerusakan</text><text x="885" y="539" text-anchor="middle" class="tiny">jalan</text><path d="M770 520 H825" stroke="#6d8a9b" stroke-width="4" stroke-dasharray="9 8"/><text x="845" y="610" text-anchor="middle" class="tiny">Keterkaitan pada data</text>
<text x="1105" y="255" class="head">Kausalitas</text><text x="1105" y="305" class="ask">Apakah perubahan menyebabkan?</text><text x="1105" y="365" class="body"><tspan x="1105">Apakah perubahan kadar air, dengan</tspan><tspan x="1105" dy="30">faktor relevan lain dipertimbangkan,</tspan><tspan x="1105" dy="30">mengubah risiko kerusakan?</tspan></text>
<rect x="1120" y="485" width="145" height="62" rx="15" fill="#fbf0e9"/><text x="1192" y="523" text-anchor="middle" class="tiny">Kadar air</text><path d="M1275 516 H1320" stroke="#c27a48" stroke-width="4" marker-end="url(#arr)"/><rect x="1330" y="485" width="145" height="62" rx="15" fill="#fbf0e9"/><text x="1402" y="523" text-anchor="middle" class="tiny">Kerusakan</text><text x="1305" y="610" text-anchor="middle" class="tiny">Perlu rancangan dan asumsi kausal</text>
<rect x="175" y="745" width="1250" height="76" rx="20" fill="#fff3e8" stroke="#edc59e" stroke-width="2"/><text x="800" y="791" text-anchor="middle" class="warn">Prediksi yang baik atau asosiasi yang kuat belum membuktikan sebab-akibat.</text>
</svg>
