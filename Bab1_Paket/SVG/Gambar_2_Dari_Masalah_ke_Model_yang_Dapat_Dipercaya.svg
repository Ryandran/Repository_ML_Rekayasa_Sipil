<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Dari masalah rekayasa ke model yang dapat dipercaya</title><desc id="desc">Alur berulang enam tahap: rumuskan kebutuhan, periksa data, tetapkan baseline, latih model, evaluasi untuk penggunaan, dan putuskan tindakan. Hasil evaluasi dapat mengarahkan kembali ke rumusan masalah atau data.</desc>
<defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.num{font-size:20px;font-weight:700;fill:#fff}.head{font-size:23px;font-weight:700}.body{font-size:18px;fill:#465d71}.foot{font-size:19px;fill:#536779}</style><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324d" flood-opacity=".11"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b879d"/></marker></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">Dari masalah ke model yang dapat dipercaya</text><text x="90" y="132" class="sub">Alur kerja berulang: setiap tahap harus menjawab kebutuhan rekayasa yang sama.</text>
<g fill="none" stroke="#6b879d" stroke-width="4" marker-end="url(#arrow)"><path d="M500 300 H570"/><path d="M1020 300 H1090"/><path d="M1320 390 V515"/><path d="M1100 610 H1030"/><path d="M580 610 H510"/><path d="M280 520 V400"/></g>
<g filter="url(#s)"><rect x="100" y="210" width="400" height="180" rx="24" fill="#fff"/><rect x="600" y="210" width="420" height="180" rx="24" fill="#fff"/><rect x="1120" y="210" width="380" height="180" rx="24" fill="#fff"/><rect x="1120" y="520" width="380" height="180" rx="24" fill="#eaf5f2"/><rect x="600" y="520" width="420" height="180" rx="24" fill="#fff"/><rect x="100" y="520" width="400" height="180" rx="24" fill="#fff"/></g>
<g><circle cx="143" cy="251" r="24" fill="#327b9a"/><text x="143" y="258" text-anchor="middle" class="num">1</text><circle cx="643" cy="251" r="24" fill="#327b9a"/><text x="643" y="258" text-anchor="middle" class="num">2</text><circle cx="1163" cy="251" r="24" fill="#327b9a"/><text x="1163" y="258" text-anchor="middle" class="num">3</text><circle cx="1163" cy="561" r="24" fill="#26866f"/><text x="1163" y="568" text-anchor="middle" class="num">4</text><circle cx="643" cy="561" r="24" fill="#327b9a"/><text x="643" y="568" text-anchor="middle" class="num">5</text><circle cx="143" cy="561" r="24" fill="#327b9a"/><text x="143" y="568" text-anchor="middle" class="num">6</text></g>
<text x="180" y="257" class="head">Rumuskan kebutuhan</text><text x="140" y="310" class="body"><tspan x="140">Apa yang perlu diprediksi atau dipahami?</tspan><tspan x="140" dy="27">Siapa yang akan menggunakan hasilnya?</tspan></text>
<text x="680" y="257" class="head">Periksa data</text><text x="640" y="310" class="body"><tspan x="640">Asal, mutu, cakupan, label, bias,</tspan><tspan x="640" dy="27">serta risiko kebocoran data.</tspan></text>
<text x="1200" y="257" class="head">Tetapkan baseline</text><text x="1160" y="310" class="body"><tspan x="1160">Bandingkan dengan metode sederhana</tspan><tspan x="1160" dy="27">atau prosedur yang sudah digunakan.</tspan></text>
<text x="1200" y="567" class="head">Latih model</text><text x="1160" y="620" class="body"><tspan x="1160">Pilih metode sesuai tujuan, data,</tspan><tspan x="1160" dy="27">dan batas penggunaan.</tspan></text>
<text x="680" y="567" class="head">Evaluasi untuk penggunaan</text><text x="640" y="620" class="body"><tspan x="640">Uji pada kasus yang mewakili</tspan><tspan x="640" dy="27">penggunaan; telaah galat dan risiko.</tspan></text>
<text x="180" y="567" class="head">Putuskan dan pantau</text><text x="140" y="620" class="body"><tspan x="140">Tetapkan batas pemakaian, tindakan</tspan><tspan x="140" dy="27">lanjutan, dan kebutuhan pemantauan.</tspan></text>
<path d="M300 735 C300 795 800 805 800 735" fill="none" stroke="#9aafbe" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="800" y="844" text-anchor="middle" class="foot">Jika bukti belum memadai, tinjau kembali pertanyaan, data, atau rancangan validasi.</text>
</svg>
