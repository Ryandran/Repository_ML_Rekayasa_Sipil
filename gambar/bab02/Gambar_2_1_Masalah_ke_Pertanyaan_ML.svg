<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Dari masalah rekayasa ke pertanyaan ML</title><desc id="desc">Enam tahap perumusan: situasi rekayasa, kebutuhan keputusan, pertanyaan analitis, unit dan cakupan, definisi keluaran, dan spesifikasi tugas serta penggunaan model.</desc>
<defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.n{font-size:20px;font-weight:700;fill:#fff}.h{font-size:23px;font-weight:700}.b{font-size:19px;fill:#40566b}.foot{font-size:19px;fill:#536779}</style><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324d" flood-opacity=".10"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#6b879d"/></marker></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">Dari masalah rekayasa ke pertanyaan ML</text><text x="90" y="132" class="sub">Perjelas keputusan yang hendak didukung sebelum menetapkan target dan algoritma.</text>
<g fill="none" stroke="#6b879d" stroke-width="4" marker-end="url(#a)"><path d="M500 285H575"/><path d="M1025 285H1100"/><path d="M1325 380V515"/><path d="M1100 610H1025"/><path d="M575 610H500"/></g>
<g filter="url(#s)"><rect x="100" y="195" width="400" height="180" rx="24" fill="#fff"/><rect x="600" y="195" width="425" height="180" rx="24" fill="#fff"/><rect x="1125" y="195" width="400" height="180" rx="24" fill="#fff"/><rect x="1125" y="520" width="400" height="180" rx="24" fill="#eaf5f2"/><rect x="600" y="520" width="425" height="180" rx="24" fill="#fff"/><rect x="100" y="520" width="400" height="180" rx="24" fill="#fff"/></g>
<g><circle cx="143" cy="235" r="23" fill="#327b9a"/><text x="143" y="242" text-anchor="middle" class="n">1</text><circle cx="643" cy="235" r="23" fill="#327b9a"/><text x="643" y="242" text-anchor="middle" class="n">2</text><circle cx="1168" cy="235" r="23" fill="#327b9a"/><text x="1168" y="242" text-anchor="middle" class="n">3</text><circle cx="1168" cy="560" r="23" fill="#26866f"/><text x="1168" y="567" text-anchor="middle" class="n">6</text><circle cx="643" cy="560" r="23" fill="#327b9a"/><text x="643" y="567" text-anchor="middle" class="n">5</text><circle cx="143" cy="560" r="23" fill="#327b9a"/><text x="143" y="567" text-anchor="middle" class="n">4</text></g>
<text x="180" y="241" class="h">Situasi rekayasa</text><text x="140" y="292" class="b"><tspan x="140">Fenomena, aset, atau proses apa</tspan><tspan x="140" dy="27">yang menjadi perhatian?</tspan></text>
<text x="680" y="241" class="h">Kebutuhan keputusan</text><text x="640" y="292" class="b"><tspan x="640">Siapa yang akan menggunakan hasil,</tspan><tspan x="640" dy="27">dan tindakan apa yang didukung?</tspan></text>
<text x="1205" y="241" class="h">Pertanyaan analitis</text><text x="1165" y="292" class="b"><tspan x="1165">Apa yang perlu diperkirakan,</tspan><tspan x="1165" dy="27">dibandingkan, atau dipahami?</tspan></text>
<text x="1205" y="566" class="h">Tugas dan penggunaan</text><text x="1165" y="617" class="b"><tspan x="1165">Klasifikasi, regresi, atau eksplorasi?</tspan><tspan x="1165" dy="27">Apa batas keputusan model?</tspan></text>
<text x="680" y="566" class="h">Definisi keluaran</text><text x="640" y="617" class="b"><tspan x="640">Target, satuan, waktu pengukuran,</tspan><tspan x="640" dy="27">dan aturan pelabelan.</tspan></text>
<text x="180" y="566" class="h">Unit dan cakupan</text><text x="140" y="617" class="b"><tspan x="140">Apa satu baris data? Aset, spesimen,</tspan><tspan x="140" dy="27">segmen, waktu, atau pengamatan?</tspan></text>
<rect x="250" y="770" width="1100" height="58" rx="24" fill="#e5edf3"/><text x="800" y="806" text-anchor="middle" class="foot">Spesifikasi yang jelas membuat pilihan data, validasi, metrik, dan algoritma lebih terarah.</text>
</svg>
