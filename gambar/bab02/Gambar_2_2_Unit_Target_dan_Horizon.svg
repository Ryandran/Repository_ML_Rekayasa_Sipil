<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Unit analisis, target, horizon, dan penggunaan</title><desc id="desc">Contoh inspeksi jembatan: unit analisis adalah jembatan-periode inspeksi; target berupa kategori kondisi pada inspeksi berikutnya; horizon adalah 12 bulan; keluaran hanya membantu menyusun prioritas pemeriksaan.</desc>
<defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.h{font-size:25px;font-weight:700}.b{font-size:20px;fill:#40566b}.lab{font-size:18px;font-weight:700;fill:#327b9a}.small{font-size:18px;fill:#536779}</style><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324d" flood-opacity=".10"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#327b9a"/></marker></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">Tentukan apa yang diprediksi dan untuk siapa</text><text x="90" y="132" class="sub">Contoh perumusan tugas untuk membantu menyusun prioritas inspeksi jembatan.</text>
<g filter="url(#s)"><rect x="100" y="200" width="330" height="230" rx="24" fill="#fff"/><rect x="475" y="200" width="330" height="230" rx="24" fill="#fff"/><rect x="850" y="200" width="300" height="230" rx="24" fill="#fff"/><rect x="1195" y="200" width="305" height="230" rx="24" fill="#fff"/></g>
<text x="140" y="250" class="lab">UNIT ANALISIS</text><text x="140" y="300" class="h">Jembatan ×</text><text x="140" y="335" class="h">periode inspeksi</text><text x="140" y="385" class="small">Satu rekaman mewakili satu</text><text x="140" y="410" class="small">jembatan pada satu periode.</text>
<text x="515" y="250" class="lab">TARGET</text><text x="515" y="300" class="h">Kategori kondisi</text><text x="515" y="335" class="h">pada inspeksi berikut</text><text x="515" y="385" class="small">Aturan penilaian dan label</text><text x="515" y="410" class="small">harus konsisten.</text>
<text x="890" y="250" class="lab">HORIZON</text><text x="890" y="300" class="h">12 bulan</text><text x="890" y="355" class="small">Periode prediksi harus</text><text x="890" y="380" class="small">sesuai rencana operasi.</text>
<text x="1235" y="250" class="lab">PENGGUNAAN</text><text x="1235" y="300" class="h">Bantu urutkan</text><text x="1235" y="335" class="h">pemeriksaan</text><text x="1235" y="385" class="small">Bukan pengganti inspeksi</text><text x="1235" y="410" class="small">atau penilaian insinyur.</text>
<path d="M435 315H465" stroke="#327b9a" stroke-width="4" marker-end="url(#a)"/><path d="M810 315H840" stroke="#327b9a" stroke-width="4" marker-end="url(#a)"/><path d="M1155 315H1185" stroke="#327b9a" stroke-width="4" marker-end="url(#a)"/>
<rect x="120" y="500" width="1360" height="260" rx="26" fill="#eaf1f6"/><text x="170" y="555" class="h">Masukan yang tersedia pada saat prediksi</text>
<g><rect x="170" y="600" width="260" height="100" rx="18" fill="#fff"/><rect x="480" y="600" width="260" height="100" rx="18" fill="#fff"/><rect x="790" y="600" width="260" height="100" rx="18" fill="#fff"/><rect x="1100" y="600" width="300" height="100" rx="18" fill="#fff"/></g>
<text x="300" y="642" text-anchor="middle" class="b">Riwayat inspeksi</text><text x="300" y="672" text-anchor="middle" class="small">sebelum waktu prediksi</text><text x="610" y="642" text-anchor="middle" class="b">Umur dan material</text><text x="610" y="672" text-anchor="middle" class="small">data aset yang tersedia</text><text x="920" y="642" text-anchor="middle" class="b">Lalu lintas dan paparan</text><text x="920" y="672" text-anchor="middle" class="small">faktor lingkungan</text><text x="1250" y="642" text-anchor="middle" class="b">Tindakan pemeliharaan</text><text x="1250" y="672" text-anchor="middle" class="small">hanya jika diketahui saat itu</text>
<text x="800" y="815" text-anchor="middle" class="small">Jangan gunakan informasi yang baru diketahui setelah target terjadi: itu dapat membocorkan jawaban ke model.</text>
</svg>
