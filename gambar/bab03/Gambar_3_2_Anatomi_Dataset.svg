<text x="230" y="439" text-anchor="middle" class="td">C-002</text><text x="485" y="439" text-anchor="middle" class="td">320</text><text x="775" y="439" text-anchor="middle" class="td">190</text><text x="1065" y="439" text-anchor="middle" class="td">28</text><text x="1345" y="439" text-anchor="middle" class="td">35.7 MPa</text>
<text x="230" y="509" text-anchor="middle" class="td">C-003</text><text x="485" y="509" text-anchor="middle" class="td">400</text><text x="775" y="509" text-anchor="middle" class="td">170</text><text x="1065" y="509" text-anchor="middle" class="td">56</text><text x="1345" y="509" text-anchor="middle" class="td">51.4 MPa</text>
<path d="M485 575V635" stroke="#327b9a" stroke-width="4" marker-end="url(#a)"/><path d="M775 575V635" stroke="#327b9a" stroke-width="4" marker-end="url(#a)"/><path d="M1065 575V635" stroke="#327b9a" stroke-width="4" marker-end="url(#a)"/><path d="M1345 575V635" stroke="#26866f" stroke-width="4" marker-end="url(#a)"/>
