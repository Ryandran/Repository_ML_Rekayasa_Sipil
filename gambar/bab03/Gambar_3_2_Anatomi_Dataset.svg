<text x="380" y="693" text-anchor="middle" class="lab">FITUR / MASUKAN</text><text x="380" y="725" text-anchor="middle" class="small">Informasi yang tersedia untuk model</text><text x="800" y="693" text-anchor="middle" class="lab">UNIT DAN METADATA</text><text x="800" y="725" text-anchor="middle" class="small">ID, lokasi, waktu, atau kelompok</text><text x="1220" y="693" text-anchor="middle" class="lab">TARGET / KELUARAN</text><text x="1220" y="725" text-anchor="middle" class="small">Nilai atau label yang dipelajari</text>
<text x="800" y="815" text-anchor="middle" class="small">Contoh angka pada gambar hanya ilustrasi struktur dataset, bukan hasil uji laboratorium.</text>
