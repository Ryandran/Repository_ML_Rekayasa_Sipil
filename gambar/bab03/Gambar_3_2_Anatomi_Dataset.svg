<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Anatomi dataset tabular</title><desc id="desc">Dataset tabular terdiri dari baris pengamatan, kolom fitur, kolom target jika supervised, dan metadata seperti ID dan cap waktu yang membantu pelacakan.</desc>
<defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.th{font-size:19px;font-weight:700;fill:#fff}.td{font-size:19px;fill:#40566b}.lab{font-size:18px;font-weight:700;fill:#327b9a}.small{font-size:18px;fill:#536779}</style><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#327b9a"/></marker></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">Anatomi dataset tabular</text><text x="90" y="132" class="sub">Sebelum memilih model, pastikan makna baris dan kolom dapat dijelaskan.</text>
<text x="120" y="225" class="lab">SATU BARIS = SATU UNIT PENGAMATAN</text>
<g><rect x="120" y="260" width="220" height="65" fill="#254a68"/><rect x="340" y="260" width="290" height="65" fill="#327b9a"/><rect x="630" y="260" width="290" height="65" fill="#327b9a"/><rect x="920" y="260" width="290" height="65" fill="#327b9a"/><rect x="1210" y="260" width="270" height="65" fill="#26866f"/></g>
<text x="230" y="301" text-anchor="middle" class="th">ID spesimen</text><text x="485" y="301" text-anchor="middle" class="th">Semen (kg/m³)</text><text x="775" y="301" text-anchor="middle" class="th">Air (kg/m³)</text><text x="1065" y="301" text-anchor="middle" class="th">Umur (hari)</text><text x="1345" y="301" text-anchor="middle" class="th">Target: kuat tekan</text>
<g stroke="#d2dde6" stroke-width="2"><rect x="120" y="325" width="1360" height="70" fill="#fff"/><rect x="120" y="395" width="1360" height="70" fill="#eef4f7"/><rect x="120" y="465" width="1360" height="70" fill="#fff"/><rect x="120" y="325" width="1360" height="210" fill="none"/><path d="M340 325V535M630 325V535M920 325V535M1210 325V535"/></g>
