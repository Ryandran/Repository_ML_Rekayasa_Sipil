<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Pembuatan dan penggunaan data sintesis secara reproduktif</title><desc id="desc">Notebook Python di Google Colab menetapkan mekanisme, parameter, dan seed, menghasilkan data sintesis, kemudian menyimpan CSV dan kamus data. Dataset digunakan bersama di Orange dan Python dengan keterbatasan yang dicatat.</desc>
<defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#536779}.h{font-size:23px;font-weight:700}.b{font-size:18px;fill:#40566b}.small{font-size:17px;fill:#536779}.num{font-size:19px;font-weight:700;fill:#fff}</style><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324d" flood-opacity=".10"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#6b879d"/></marker></defs>
<rect width="1600" height="900" fill="#f5f8fb"/><text x="90" y="92" class="title">Data sintesis yang dapat dibuat ulang</text><text x="90" y="132" class="sub">Notebook pembangkit membuat contoh terkontrol; notebook analisis dan Orange memakai dataset yang sama.</text>
<g filter="url(#s)"><rect x="90" y="220" width="330" height="210" rx="24" fill="#fff"/><rect x="470" y="220" width="330" height="210" rx="24" fill="#fff"/><rect x="850" y="220" width="300" height="210" rx="24" fill="#eaf1f6"/><rect x="1200" y="220" width="310" height="210" rx="24" fill="#fff"/></g>
<g><circle cx="130" cy="260" r="22" fill="#327b9a"/><text x="130" y="267" text-anchor="middle" class="num">1</text><circle cx="510" cy="260" r="22" fill="#327b9a"/><text x="510" y="267" text-anchor="middle" class="num">2</text><circle cx="890" cy="260" r="22" fill="#327b9a"/><text x="890" y="267" text-anchor="middle" class="num">3</text><circle cx="1240" cy="260" r="22" fill="#26866f"/><text x="1240" y="267" text-anchor="middle" class="num">4</text></g>
<text x="170" y="267" class="h">Tentukan mekanisme</text><text x="130" y="315" class="b"><tspan x="130">Hubungan yang ingin dipelajari,</tspan><tspan x="130" dy="26">rentang variabel, noise, dan</tspan><tspan x="130" dy="26">batas contoh.</tspan></text>
<text x="550" y="267" class="h">Tetapkan parameter</text><text x="510" y="315" class="b"><tspan x="510">Seed, ukuran sampel, unit,</tspan><tspan x="510" dy="26">kamus data, dan aturan</tspan><tspan x="510" dy="26">pembangkit.</tspan></text>
<text x="930" y="267" class="h">Hasilkan dataset</text><text x="890" y="315" class="b"><tspan x="890">Notebook Python (.ipynb)</tspan><tspan x="890" dy="26">dijalankan di Google Colab</tspan><tspan x="890" dy="26">dan menyimpan CSV.</tspan></text>
<text x="1280" y="267" class="h">Gunakan bersama</text><text x="1240" y="315" class="b"><tspan x="1240">Orange untuk alur visual;</tspan><tspan x="1240" dy="26">Python untuk analisis yang</tspan><tspan x="1240" dy="26">dapat diubah dan diulang.</tspan></text>
<g fill="none" stroke="#6b879d" stroke-width="4" marker-end="url(#a)"><path d="M425 325H460"/><path d="M805 325H840"/><path d="M1155 325H1190"/></g>
<rect x="170" y="510" width="1260" height="190" rx="26" fill="#fff3e8" stroke="#edc59e" stroke-width="2"/><text x="220" y="565" class="h">Batas interpretasi</text><text x="220" y="612" class="b"><tspan x="220">Data sintesis membantu menguji alur kerja dan mengajarkan konsep pada kondisi yang diketahui.</tspan><tspan x="220" dy="32">Data tersebut tidak otomatis mewakili populasi lapangan atau membuktikan kinerja pada sistem nyata.</tspan></text>
<text x="800" y="770" text-anchor="middle" class="small">Repository menyimpan generator, notebook analisis, kamus data, dan catatan asumsi agar latihan dapat direproduksi.</text>
</svg>
