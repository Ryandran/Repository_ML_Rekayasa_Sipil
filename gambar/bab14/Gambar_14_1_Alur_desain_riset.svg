<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#17365d">Dari persoalan rekayasa ke protokol riset yang dapat ditelaah</text><g font-family="Arial" text-anchor="middle"><g fill="#e5f1f0" stroke="#1f6e69" stroke-width="3"><rect x="48" y="145" width="220" height="130" rx="18"/><rect x="340" y="145" width="220" height="130" rx="18"/><rect x="632" y="145" width="220" height="130" rx="18"/><rect x="924" y="145" width="220" height="130" rx="18"/><rect x="195" y="420" width="220" height="130" rx="18"/><rect x="490" y="420" width="220" height="130" rx="18"/><rect x="785" y="420" width="220" height="130" rx="18"/></g><g fill="#17365d" font-size="20" font-weight="700"><text x="158" y="190">Pertanyaan</text><text x="158" y="225">dan jenis klaim</text><text x="450" y="190">Populasi, unit,</text><text x="450" y="225">target, horizon</text><text x="742" y="190">Asal, mutu,</text><text x="742" y="225">waktu data</text><text x="1034" y="190">Baseline, split,</text><text x="1034" y="225">metrik</text><text x="305" y="465">Protokol dan</text><text x="305" y="500">risiko desain</text><text x="600" y="465">Eksekusi dan</text><text x="600" y="500">reproduksibilitas</text><text x="895" y="465">Batas bukti dan</text><text x="895" y="500">audit Bab 15</text></g><g stroke="#718096" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M268 210 H335"/><path d="M560 210 H627"/><path d="M852 210 H919"/><path d="M1034 280 C1034 355 900 365 895 415"/><path d="M785 485 H715"/><path d="M490 485 H425"/></g></g><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">Rencana boleh berubah ketika bukti baru muncul; catat perubahan dan alasannya.</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="