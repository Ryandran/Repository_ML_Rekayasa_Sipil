<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17365d">Rantai bukti dan batas klaim</text><g font-family="Arial" text-anchor="middle"><g fill="#e5f1f0" stroke="#1f6e69" stroke-width="3"><rect x="65" y="155" width="225" height="125" rx="18"/><rect x="345" y="155" width="225" height="125" rx="18"/><rect x="625" y="155" width="225" height="125" rx="18"/><rect x="905" y="155" width="225" height="125" rx="18"/></g><g fill="#17365d" font-size="20" font-weight="700"><text x="177" y="200">Protokol</text><text x="177" y="235">dan target</text><text x="457" y="200">Split, baseline</text><text x="457" y="235">dan metrik</text><text x="737" y="200">Sensitivitas,</text><text x="737" y="235">residual, domain</text><text x="1017" y="200">Klaim yang</text><text x="1017" y="235">didukung</text></g><g stroke="#718096" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M290 217 H337"/><path d="M570 217 H617"/><path d="M850 217 H897"/></g><rect x="185" y="400" width="830" height="135" rx="18" fill="#fff3e0" stroke="#c47a00" stroke-width="3"/><text x="600" y="447" font-family="Arial" text-anchor="middle" font-size="22" font-weight="700" fill="#7a4b00">Bukti sintetis menguji pipeline dan DGP</text><text x="600" y="485" font-family="Arial" text-anchor="middle" font-size="20" fill="#7a4b00">tidak membuktikan transfer lapangan, kausalitas, atau keselamatan</text><path d="M737 280 C737 345 620 345 600 394" stroke="#c47a00" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#b)"/><text x="600" y="610" font-family="Arial" text-anchor="middle" font-size="18" fill="#334155">Setiap klaim harus berhenti pada batas desain dan data yang benar-benar diuji.</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill