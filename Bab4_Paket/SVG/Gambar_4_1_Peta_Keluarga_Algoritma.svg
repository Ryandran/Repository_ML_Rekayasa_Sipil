<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Peta keluarga algoritma machine learning</title><desc id="desc">Pemetaan tugas berdasarkan ketersediaan target ke metode supervised dan unsupervised.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#718096"/></marker></defs>
<rect width="1200" height="760" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203040">
<text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">Memilih keluarga algoritma dari tujuan analisis</text>
<rect x="470" y="90" width="260" height="70" rx="15" fill="#e8eef7" stroke="#687b91" stroke-width="2"/><text x="600" y="133" text-anchor="middle" font-size="23" font-weight="700">Target tersedia?</text>
<path d="M520 160 C440 195 300 205 280 245" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><path d="M680 160 C760 195 900 205 920 245" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><text x="390" y="202" font-size="17">Ya</text><text x="800" y="202" font-size="17">Tidak</text>
<rect x="80" y="250" width="470" height="80" rx="14" fill="#d9edf7" stroke="#3982a5" stroke-width="2"/><text x="315" y="284" text-anchor="middle" font-size="22" font-weight="700">Supervised learning</text><text x="315" y="312" text-anchor="middle" font-size="17">Belajar dari fitur dan target berlabel</text>
<rect x="650" y="250" width="470" height="80" rx="14" fill="#fce8d5" stroke="#c27b34" stroke-width="2"/><text x="885" y="284" text-anchor="middle" font-size="22" font-weight="700">Unsupervised learning</text><text x="885" y="312" text-anchor="middle" font-size="17">Mencari struktur tanpa target pelatihan</text>
<path d="M250 330V390" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><path d="M380 330V390" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/>
<rect x="90" y="400" width="300" height="70" rx="12" fill="#edf6fb" stroke="#3982a5"/><text x="240" y="430" text-anchor="middle" font-size="20" font-weight="700">Target numerik</text><text x="240" y="455" text-anchor="middle" font-size="17">Regresi</text>
<rect x="420" y="400" width="300" height="70" rx="12" fill="#edf6fb" stroke="#3982a5"/><text x="570" y="430" text-anchor="middle" font-size="20" font-weight="700">Target kelas</text><text x="570" y="455" text-anchor="middle" font-size="17">Klasifikasi</text>
<rect x="70" y="510" width="340" height="155" rx="12" fill="#f6fbfd" stroke="#8bb4c8"/><text x="240" y="544" text-anchor="middle" font-size="18" font-weight="700">Linear · pohon · ensemble</text><text x="240" y="577" text-anchor="middle" font-size="17">k-NN · SVM · jaringan saraf</text><text x="240" y="618" text-anchor="middle" font-size="15">Pilih berdasar bentuk target dan data</text>
<rect x="440" y="510" width="340" height="155" rx="12" fill="#f6fbfd" stroke="#8bb4c8"/><text x="610" y="544" text-anchor="middle" font-size="18" font-weight="700">Logistik · pohon · ensemble</text><text x="610" y="577" text-anchor="middle" font-size="17">k-NN · SVM · jaringan saraf</text><text x="610" y="618" text-anchor="middle" font-size="15">Kelas dan ambang perlu didefinisikan</text>
<path d="M820 330V390" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><path d="M970 330V390" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/>
<rect x="790" y="400" width="190" height="70" rx="12" fill="#fff7ed" stroke="#c27b34"/><text x="885" y="430" text-anchor="middle" font-size="18" font-weight="700">Kelompok</text><text x="885" y="455" text-anchor="middle" font-size="16">k-means · hierarkis · DBSCAN</text>
<rect x="1000" y="400" width="180" height="70" rx="12" fill="#fff7ed" stroke="#c27b34"/><text x="1090" y="430" text-anchor="middle" font-size="18" font-weight="700">Anomali / dimensi</text><text x="1090" y="455" text-anchor="middle" font-size="16">IF · LOF · PCA</text>
<text x="600" y="720" text-anchor="middle" font-size="16" fill="#526171">Keluarga algoritma menyusun kandidat; evaluasi dan konteks penggunaan menentukan kelayakannya.</text>
</g></svg>
