<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="#f7f9fc"/><text x="750" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#142b45">Dari keterbatasan data menuju agenda riset ML rekayasa sipil</text>
<g font-family="Arial" fill="#18324f"><rect x="65" y="145" width="330" height="430" rx="24" fill="#fff" stroke="#7aa6c2" stroke-width="3"/><text x="230" y="195" text-anchor="middle" font-size="25" font-weight="700">Tantangan nyata</text>
<text x="100" y="250" font-size="20">• Data kecil, timpang, berisik</text><text x="100" y="295" font-size="20">• Lokasi dan waktu berbeda</text><text x="100" y="340" font-size="20">• Sensor dan format beragam</text><text x="100" y="385" font-size="20">• Risiko keputusan dan biaya</text><text x="100" y="430" font-size="20">• Bukti generalisasi terbatas</text><text x="100" y="500" font-size="17" fill="#53687b">Masalah rekayasa menentukan</text><text x="100" y="526" font-size="17" fill="#53687b">bukti yang perlu dikumpulkan.</text>
<path d="M415 355 H515" stroke="#536f8c" stroke-width="8"/><path d="M515 355 l-28 -18 v36 z" fill="#536f8c"/>
<rect x="545" y="145" width="420" height="430" rx="24" fill="#fff" stroke="#4b9a82" stroke-width="3"/><text x="755" y="195" text-anchor="middle" font-size="25" font-weight="700">Arah pengembangan</text><text x="585" y="250" font-size="19">1  Data-centric dan benchmark bersama</text><text x="585" y="295" font-size="19">2  Pembelajaran ML yang kritis</text><text x="585" y="340" font-size="19">3  Standar pelaporan dan uji</text><text x="585" y="385" font-size="19">4  Model fisik, kausal, dan terjelaskan</text><text x="585" y="430" font-size="19">5  Sensor, robotika, komputasi tepi</text><text x="585" y="475" font-size="19">6  Metode khusus domain dan multimodal</text><text x="585" y="530" font-size="17" fill="#53687b">Arah ini memerlukan tingkat bukti</text><text x="585" y="554" font-size="17" fill="#53687b">dan validasi yang berbeda.</text>
<path d="M985 355 H1085" stroke="#536f8c" stroke-width="8"/><path d="M1085 355 l-28 -18 v36 z" fill="#536f8c"/>
<rect x="1115" y="145" width="330" height="430" rx="24" fill="#fff" stroke="#d49b46" stroke-width="3"/><text x="1280" y="195" text-anchor="middle" font-size="25" font-weight="700">Hasil riset</text><text x="1150" y="255" font-size="19">• Klaim yang terukur</text><text x="1150" y="300" font-size="19">• Benchmark dapat diulang</text><text x="1150" y="345" font-size="19">• Batas berlaku diketahui</text><text x="1150" y="390" font-size="19">• Ketidakpastian dilaporkan</text><text x="1150" y="435" font-size="19">• Peran insinyur jelas</text><text x="1150" y="500" font-size="17" fill="#53687b">Keluaran bukan sekadar skor,</text><text x="1150" y="526" font-size="17" fill="#53687b">melainkan bukti untuk keputusan.</text>
<text x="750" y="660" text-anchor="middle" font-family="Arial" font-size="18" fill="#53687b">Setiap arah adalah hipotesis riset yang harus diuji terhadap kebutuhan, data, pembanding, dan konsekuensi rekayasa.</text></g></svg>