<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">Tiga tugas pembelajaran machine learning</title><desc id="d">Regresi memprediksi nilai kontinu, klasifikasi memberi kelas untuk keputusan, dan clustering mencari profil tanpa label target.</desc><rect width="1100" height="520" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203447"><text x="550" y="55" text-anchor="middle" font-size="29" font-weight="700">Tiga tugas, tiga cara membaca hasil</text><g><rect x="55" y="125" width="300" height="310" rx="18" fill="#eef5fb" stroke="#6b91b1" stroke-width="2"/><text x="205" y="175" text-anchor="middle" font-size="24" font-weight="700">Regresi</text><text x="205" y="215" text-anchor="middle" font-size="17">stabilitas Marshall (kN)</text><path d="M100 350 L155 325 L205 300 L255 250 L310 225" fill="none" stroke="#2673a8" stroke-width="4"/><g fill="#d87b35"><circle cx="105" cy="342" r="6"/><circle cx="160" cy="332" r="6"/><circle cx="212" cy="290" r="6"/><circle cx="260" cy="265" r="6"/><circle cx="304" cy="214" r="6"/></g><text x="205" y="395" text-anchor="middle" font-size="16">Periksa error dalam satuan teknik</text></g><g><rect x="400" y="125" width="300" height="310" rx="18" fill="#fff4e6" stroke="#c99450" stroke-width="2"/><text x="550" y="175" text-anchor="middle" font-size="24" font-weight="700">Klasifikasi</text><text x="550" y="215" text-anchor="middle" font-size="17">prioritas rendah / tinggi</text><rect x="465" y="255" width="170" height="95" fill="#fff" stroke="#5f7180" stroke-width="2"/><path d="M550 255v95M465 302h170" stroke="#5f7180" stroke-width="2"/><text x="507" y="288" text-anchor="middle" font-size="18">TN</text><text x="592" y="288" text-anchor="middle" font-size="18">FP</text><text x="507" y="333" text-anchor="middle" font-size="18">FN</text><text x="592" y="333" text-anchor="middle" font-size="18">TP</text><text x="550" y="395" text-anchor="middle" font-size="16">Timbang alarm dan kasus terlewat</text></g><g><rect x="745" y="125" width="300" height="310" rx="18" fill="#edf5ee" stroke="#6e9774" stroke-width="2"/><text x="895" y="175" text-anchor="middle" font-size="24" font-weight="700">Clustering</text><text x="895" y="215" text-anchor="middle" font-size="17">profil kondisi tanpa target</text><g><circle cx="825" cy="285" r="8" fill="#3d83af"/><circle cx="850" cy="267" r="8" fill="#3d83af"/><circle cx="865" cy="300" r="8" fill="#3d83af"/><circle cx="930" cy="270" r="8" fill="#cf7e37"/><circle cx="955" cy="300" r="8" fill="#cf7e37"/><circle cx="980" cy="265" r="8" fill="#cf7e37"/><circle cx="865" cy="340" r="8" fill="#6d9a62"/><circle cx="890" cy="360" r="8" fill="#6d9a62"/><circle cx="913" cy="335" r="8" fill="#6d9a62"/></g><text x="895" y="395" text-anchor="middle" font-size="16">Tafsirkan profil dan kestabilannya</text></g><text x="550" y="485" text-anchor="middle" font-size="16" fill="#526775">Angka atau kelompok harus ditautkan kembali pada pertanyaan dan keputusan rekayasa.</text></g></svg>
