<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t d"><title id="t">Dua jalur praktik analisis machine learning</title><desc id="d">Dataset yang sama mengalir melalui alur visual Orange dan prosedur Python; keduanya bertemu pada evaluasi dan penilaian rekayasa.</desc><rect width="1100" height="470" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203447"><text x="550" y="48" text-anchor="middle" font-size="28" font-weight="700">Dua jalur, satu pertanyaan rekayasa</text><rect x="45" y="175" width="200" height="110" rx="14" fill="#edf3f6" stroke="#486579" stroke-width="2"/><text x="145" y="218" text-anchor="middle" font-size="20" font-weight="700">Data yang</text><text x="145" y="246" text-anchor="middle" font-size="20" font-weight="700">sama</text><rect x="345" y="90" width="245" height="110" rx="14" fill="#ffe4b8" stroke="#c48028" stroke-width="2"/><text x="467" y="132" text-anchor="middle" font-size="21" font-weight="700">Orange</text><text x="467" y="162" text-anchor="middle" font-size="17">widget dan aliran visual</text><rect x="345" y="270" width="245" height="110" rx="14" fill="#dceeff" stroke="#3976a5" stroke-width="2"/><text x="467" y="312" text-anchor="middle" font-size="21" font-weight="700">Python</text><text x="467" y="342" text-anchor="middle" font-size="17">kode dan pipeline eksplisit</text><rect x="720" y="175" width="330" height="110" rx="14" fill="#e3f1e7" stroke="#4d8060" stroke-width="2"/><text x="885" y="215" text-anchor="middle" font-size="20" font-weight="700">Evaluasi dan pemeriksaan</text><text x="885" y="245" text-anchor="middle" font-size="17">metrik • kasus • batas penggunaan</text><path d="M245 230 C285 230 295 145 345 145M245 230 C285 230 295 325 345 325M590 145 C645 145 665 210 720 215M590 325 C645 325 665 260 720 245" fill="none" stroke="#718998" stroke-width="4"/><g fill="#526775" font-size="16"><text x="467" y="425" text-anchor="middle">Samakan fitur, target, pemisahan data, seed, dan metrik sebelum membandingkan.</text></g></g></svg>
